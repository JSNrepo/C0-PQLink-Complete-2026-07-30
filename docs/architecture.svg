<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">C0-PQLink live-session architecture</title>
  <desc id="desc">A constrained IoT client locally performs ML-KEM-512 encapsulation, streams authenticated ciphertext fragments to a replaceable peer which decapsulates, verifies bilateral Finished, and exchanges Ascon-AEAD128 application records.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef4f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#16324f" flood-opacity=".13"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1769aa"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#13795b"/>
    </marker>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #17324d; }
      .title { font-size: 32px; font-weight: 750; }
      .subtitle { font-size: 16px; fill: #536b80; }
      .panel-title { font-size: 21px; font-weight: 700; }
      .panel-sub { font-size: 13px; fill: #60758a; }
      .box-title { font-size: 15px; font-weight: 700; }
      .box-copy { font-size: 12.5px; fill: #40596f; }
      .step { font-size: 13px; font-weight: 700; fill: white; }
      .flow { font-size: 12.5px; font-weight: 650; }
      .badge { font-size: 12px; font-weight: 700; }
      .foot-title { font-size: 14px; font-weight: 700; }
      .foot-copy { font-size: 12.5px; fill: #40596f; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="60" y="58" class="title">C0-PQLink: post-quantum live sessions</text>
  <text x="60" y="86" class="subtitle">Exact standardized primitives • constrained execution schedule • replaceable peer</text>

  <g transform="translate(850 40)">
    <rect width="126" height="30" rx="15" fill="#dceeff"/>
    <text x="63" y="20" text-anchor="middle" class="badge" fill="#1769aa">FIPS 203</text>
    <rect x="136" width="154" height="30" rx="15" fill="#dff4ec"/>
    <text x="213" y="20" text-anchor="middle" class="badge" fill="#13795b">SP 800-232</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="55" y="120" width="390" height="470" rx="22" fill="#ffffff" stroke="#b7d9f5" stroke-width="2"/>
    <rect x="755" y="120" width="390" height="470" rx="22" fill="#ffffff" stroke="#b8dfd1" stroke-width="2"/>
    <rect x="485" y="120" width="230" height="470" rx="22" fill="#ffffff" stroke="#cad5df" stroke-width="2"/>
  </g>

  <circle cx="91" cy="159" r="20" fill="#1769aa"/>
  <path d="M82 151h18v16H82z M86 147v4 M92 147v4 M98 147v4 M86 167v4 M92 167v4 M98 167v4 M78 155h4 M78 162h4 M100 155h4 M100 162h4" stroke="white" stroke-width="2" fill="none"/>
  <text x="124" y="156" class="panel-title">Constrained IoT client</text>
  <text x="124" y="178" class="panel-sub">Encapsulator • C / Arduino / native MicroPython</text>

  <circle cx="791" cy="159" r="20" fill="#13795b"/>
  <path d="M782 150h18v18h-18z M778 155h4 M778 163h4 M800 155h4 M800 163h4 M786 146v4 M794 146v4 M786 168v4 M794 168v4" stroke="white" stroke-width="2" fill="none"/>
  <text x="824" y="156" class="panel-title">Replaceable peer</text>
  <text x="824" y="178" class="panel-sub">Decapsulator • gateway / controller / endpoint</text>

  <text x="600" y="153" text-anchor="middle" class="panel-title">Untrusted link</text>
  <text x="600" y="175" text-anchor="middle" class="panel-sub">loss • replay • injection</text>

  <g>
    <rect x="82" y="207" width="336" height="67" rx="12" fill="#edf7ff" stroke="#b7d9f5"/>
    <circle cx="107" cy="231" r="14" fill="#1769aa"/>
    <text x="107" y="236" text-anchor="middle" class="step">1</text>
    <text x="130" y="232" class="box-title">PSK-authenticated preflight</text>
    <text x="130" y="253" class="box-copy">128-bit client nonce • pinned key ID + epoch</text>
  </g>

  <g>
    <rect x="82" y="292" width="336" height="112" rx="12" fill="#edf7ff" stroke="#b7d9f5"/>
    <circle cx="107" cy="317" r="14" fill="#1769aa"/>
    <text x="107" y="322" text-anchor="middle" class="step">2</text>
    <text x="130" y="318" class="box-title">Exact ML-KEM-512 encapsulation</text>
    <text x="130" y="340" class="box-copy">800-byte public key read from flash callback</text>
    <text x="130" y="360" class="box-copy">1,344-byte arena • current Nano link fails SRAM gate</text>
    <rect x="130" y="373" width="250" height="18" rx="9" fill="#cfe9ff"/>
    <g fill="#1769aa">
      <rect x="134" y="377" width="11" height="10" rx="2"/><rect x="149" y="377" width="11" height="10" rx="2"/>
      <rect x="164" y="377" width="11" height="10" rx="2"/><rect x="179" y="377" width="11" height="10" rx="2"/>
      <rect x="194" y="377" width="11" height="10" rx="2"/><rect x="209" y="377" width="11" height="10" rx="2"/>
      <rect x="224" y="377" width="11" height="10" rx="2"/><rect x="239" y="377" width="11" height="10" rx="2"/>
      <rect x="254" y="377" width="11" height="10" rx="2"/><rect x="269" y="377" width="11" height="10" rx="2"/>
      <rect x="284" y="377" width="11" height="10" rx="2"/><rect x="299" y="377" width="11" height="10" rx="2"/>
      <rect x="314" y="377" width="11" height="10" rx="2"/><rect x="329" y="377" width="11" height="10" rx="2"/>
      <rect x="344" y="377" width="11" height="10" rx="2"/><rect x="359" y="377" width="11" height="10" rx="2"/>
    </g>
  </g>

  <g>
    <rect x="782" y="207" width="336" height="67" rx="12" fill="#ecfaf5" stroke="#b8dfd1"/>
    <circle cx="807" cy="231" r="14" fill="#13795b"/>
    <text x="807" y="236" text-anchor="middle" class="step">1</text>
    <text x="830" y="232" class="box-title">Verify preflight before PQ work</text>
    <text x="830" y="253" class="box-copy">Per-device PSK • fresh peer nonce</text>
  </g>

  <g>
    <rect x="782" y="292" width="336" height="112" rx="12" fill="#ecfaf5" stroke="#b8dfd1"/>
    <circle cx="807" cy="317" r="14" fill="#13795b"/>
    <text x="807" y="322" text-anchor="middle" class="step">3</text>
    <text x="830" y="318" class="box-title">Standard ML-KEM decapsulation</text>
    <text x="830" y="340" class="box-copy">Private key stays at the key-owning endpoint</text>
    <text x="830" y="360" class="box-copy">Reassembles only authenticated fragments</text>
    <text x="830" y="381" class="box-copy">Derives the same transcript-bound session</text>
  </g>

  <line x1="418" y1="240" x2="780" y2="240" stroke="#1769aa" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="600" y="229" text-anchor="middle" class="flow">Hello (60 B)</text>
  <line x1="782" y1="264" x2="420" y2="264" stroke="#13795b" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="600" y="285" text-anchor="middle" class="flow">Challenge (84 B)</text>

  <line x1="418" y1="332" x2="780" y2="332" stroke="#1769aa" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="600" y="320" text-anchor="middle" class="flow">16 × authenticated 48-byte CT</text>
  <line x1="782" y1="365" x2="420" y2="365" stroke="#13795b" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="600" y="386" text-anchor="middle" class="flow">ACK / selective retry</text>

  <g>
    <rect x="82" y="426" width="336" height="67" rx="12" fill="#f4f0ff" stroke="#cdbff3"/>
    <circle cx="107" cy="450" r="14" fill="#7251b5"/>
    <text x="107" y="455" text-anchor="middle" class="step">4</text>
    <text x="130" y="451" class="box-title">Verify bilateral Finished</text>
    <text x="130" y="472" class="box-copy">PSK + ML-KEM secret + exact transcript</text>
  </g>
  <g>
    <rect x="782" y="426" width="336" height="67" rx="12" fill="#f4f0ff" stroke="#cdbff3"/>
    <circle cx="807" cy="450" r="14" fill="#7251b5"/>
    <text x="807" y="455" text-anchor="middle" class="step">4</text>
    <text x="830" y="451" class="box-title">Verify bilateral Finished</text>
    <text x="830" y="472" class="box-copy">Session opens only after both proofs</text>
  </g>
  <line x1="418" y1="450" x2="780" y2="450" stroke="#7251b5" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <line x1="782" y1="474" x2="420" y2="474" stroke="#7251b5" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="600" y="440" text-anchor="middle" class="flow">Finished (26 B each)</text>

  <g>
    <rect x="82" y="512" width="1036" height="54" rx="12" fill="#fff8e8" stroke="#efd38c"/>
    <circle cx="107" cy="539" r="14" fill="#b87800"/>
    <text x="107" y="544" text-anchor="middle" class="step">5</text>
    <text x="132" y="535" class="box-title">Live application records</text>
    <text x="132" y="555" class="box-copy">Ascon-AEAD128 • ≤48 B • sequence + optional ratchet</text>
  </g>

  <line x1="700" y1="532" x2="1060" y2="532" stroke="#b87800" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <line x1="1060" y1="552" x2="700" y2="552" stroke="#b87800" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <g transform="translate(55 610)">
    <rect width="530" height="88" rx="14" fill="#e9f5ff"/>
    <text x="20" y="27" class="foot-title" fill="#1769aa">What stays on the device</text>
    <text x="20" y="50" class="foot-copy">ML-KEM computation • randomness • ciphertext generation</text>
    <text x="20" y="68" class="foot-copy">Finished verification • application record crypto</text>
  </g>
  <g transform="translate(615 610)">
    <rect width="530" height="88" rx="14" fill="#e8f7f1"/>
    <text x="20" y="27" class="foot-title" fill="#13795b">What never moves to the device</text>
    <text x="20" y="50" class="foot-copy">Peer ML-KEM private key/seed • peer decapsulation state</text>
    <text x="20" y="68" class="foot-copy">No cloud dependency and no delegated client computation</text>
  </g>
</svg>
